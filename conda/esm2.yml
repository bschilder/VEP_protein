name: esm2
channels:
    - conda-forge
    - nvidia
dependencies:
    - python>=3.9.0
    - pandas
    - numpy>=1.15.1
    - openpyxl
    - tqdm
    - IProgress
    - ipywidgets
    - ipykernel
    - entrypoints
    - seaborn
    - plotly
    - scikit-learn
    - pyarrow
    - conda-forge::biopython
    # - bioconda::clustalw # Optional, for consensus sequence
    # - bioconda::clustalo # Optional, for consensus sequence
    - setuptools==69.5.1
    - cmake
    - owlready2
    - pooch
    - pip
    - pip:
        - torch 
        - torchvision 
        - torchaudio
        # - fair-esm[esmfold] # Old ESM module
        - "fair-esm2 @ git+https://github.com/YaoYinYing/esm2.git" # See:https://github.com/evolutionaryscale/esm/issues/12#issuecomment-2668085866
        - python-Levenshtein
        - ensembl-rest
        - gprofiler-official
        - script-utils
