name: vep_protein
channels:
    - conda-forge  
    - bioconda
    - nvidia
dependencies:
    - python>=3.9.0
    - pandas
    - numpy
    - openpyxl
    - tqdm
    - umap-learn
    - IProgress
    - ipywidgets
    - ipkernel
    - pyfaidx
    - pysam
    - HTSeq
    - plotly
    - seaborn
    - scikit-learn
    - biopython
    - pyensembl 
    - biotite
    - owlready2
    - pooch
    - pip
    - pip:
        - torch 
        - torchvision 
        - torchaudio
        # - fair-esm[esmfold] # Old ESM module
        - "--editable=git+https://github.com/YaoYinYing/esm2.git" # https://github.com/evolutionaryscale/esm/issues/12#issuecomment-2668085866
        - esm # New ESM module
        - logomaker
        - python-Levenshtein
        - ensembl-rest
        - gprofiler-official